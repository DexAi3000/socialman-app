server {
    server_name nimaariyanfar.com www.nimaariyanfar.com;
    root /var/www/nima-portfolio;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1h;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nimaariyanfar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimaariyanfar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name nimaariyanfar.com www.nimaariyanfar.com;
    return 301 https://$host$request_uri;
}
